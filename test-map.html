<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Map Test - Delivery Rush</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/map.css">
  <script>
    const p = new URLSearchParams(window.location.search);
    const m = p.get('mood') || 'day';
    const th = p.get('theme') || 'light';
    document.documentElement.setAttribute('data-mood', m);
    document.documentElement.setAttribute('data-theme', th);
  </script>
  <style>
    body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .test-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      max-width: 700px;
      width: 100%;
    }
    .test-controls select, .test-controls button {
      min-height: 36px;
      padding: 0.25rem 0.75rem;
      font-size: 0.8125rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--font-sans);
    }
    .fps-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-weight: 700;
    }
    .map-wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="test-controls">
    <label>Mood:
      <select id="moodSelect">
        <option value="day">Day (Lunch)</option>
        <option value="evening">Evening (Dinner)</option>
        <option value="rain">Rain (Rain Shift)</option>
      </select>
    </label>
    <label>Theme:
      <select id="themeSelect">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <button type="button" id="playBtn">Pause</button>
    <button type="button" id="stepBtn">Step +1m</button>
    <span id="minuteLabel" class="num">Minute 0</span>
    <span id="fpsLabel" class="fps-badge">FPS: 60</span>
  </div>

  <div class="map-wrapper" id="mapWrapper">
    <div class="map-container" id="mapContainer">
      <div id="cityLayer" style="width:100%; height:100%;"></div>
      <svg viewBox="0 0 520 520" class="actors-svg-layer" id="actorsSvg" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;">
        <g id="actorsGroup"></g>
      </svg>
      <canvas class="map-rain-canvas" id="rainCanvas" width="520" height="520"></canvas>
    </div>
  </div>

  <script type="module">
    import { CITY, SHIFTS } from "./js/content.js";
    import { runAlgorithm } from "./js/engine/algo.js";
    import { renderCitySvg } from "./js/ui/city.js";
    import { renderActorsSvg } from "./js/ui/actors.js";
    import { createRainOverlay } from "./js/ui/rain.js";

    const params = new URLSearchParams(window.location.search);
    const initialMood = params.get("mood") || "day";
    const initialTheme = params.get("theme") || "light";
    const initialMinute = parseInt(params.get("t") || "12", 10);
    const staticOnly = params.get("static") === "1";

    document.documentElement.setAttribute("data-theme", initialTheme);
    document.documentElement.setAttribute("data-mood", initialMood);
    document.getElementById("mapContainer").setAttribute("data-mood", initialMood);
    document.getElementById("themeSelect").value = initialTheme;
    document.getElementById("moodSelect").value = initialMood;

    const moodToShift = {
      day: SHIFTS.find(s => s.id === "lunch"),
      evening: SHIFTS.find(s => s.id === "dinner"),
      rain: SHIFTS.find(s => s.id === "rain")
    };

    let currentMood = initialMood;
    let shiftData = moodToShift[currentMood] || moodToShift.day;
    let algoRun = runAlgorithm(CITY, shiftData);
    let currentFrameIdx = Math.min(initialMinute, algoRun.frames.length - 1);
    let progress = 0;
    let isPlaying = !staticOnly;
    let lastRenderedClosed = null;

    const mapContainer = document.getElementById("mapContainer");
    const cityLayer = document.getElementById("cityLayer");
    const actorsGroup = document.getElementById("actorsGroup");
    const rainCanvas = document.getElementById("rainCanvas");
    const minuteLabel = document.getElementById("minuteLabel");
    const fpsLabel = document.getElementById("fpsLabel");
    const playBtn = document.getElementById("playBtn");
    const moodSelect = document.getElementById("moodSelect");
    const themeSelect = document.getElementById("themeSelect");
    const stepBtn = document.getElementById("stepBtn");

    const rain = createRainOverlay(rainCanvas);
    if (currentMood === "rain") rain.start();

    // FPS Counter
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    function getActiveOrdersForFrame(frame) {
      if (!frame) return [];
      const sim = algoRun.sim;
      return sim.orders.filter(o => {
        return (o.status === "waiting" || o.status === "assigned") && o.at <= frame.t;
      });
    }

    // Build or update the static city ONLY when mood or flood state changes
    function updateCityStatic(closed = []) {
      const closedKey = currentMood + ":" + JSON.stringify(closed);
      if (lastRenderedClosed === closedKey && cityLayer.innerHTML) return;
      lastRenderedClosed = closedKey;
      cityLayer.innerHTML = renderCitySvg(currentMood, closed);
    }

    // Dynamic actors update only
    function updateActors() {
      const frame = algoRun.frames[currentFrameIdx] || algoRun.frames[0];
      const closed = frame.closed || [];
      updateCityStatic(closed);

      const activeOrders = getActiveOrdersForFrame(frame);
      actorsGroup.innerHTML = renderActorsSvg({
        riders: frame.riders,
        orders: activeOrders,
        progress: progress,
        riderScale: 1.0,
        moments: []
      });

      minuteLabel.textContent = `Minute ${frame.t} of ${algoRun.frames.at(-1).t}`;
    }

    function loop(now) {
      frameCount++;
      if (now - lastTime >= 1000) {
        fps = Math.round((frameCount * 1000) / (now - lastTime));
        fpsLabel.textContent = `FPS: ${fps}`;
        window.__TEST_FPS__ = fps;
        frameCount = 0;
        lastTime = now;
      }

      if (isPlaying) {
        progress += 0.035;
        if (progress >= 1) {
          progress = 0;
          currentFrameIdx++;
          if (currentFrameIdx >= algoRun.frames.length) {
            currentFrameIdx = 0;
          }
        }
        updateActors();
      }

      requestAnimationFrame(loop);
    }

    function updateMood(nextMood) {
      currentMood = nextMood;
      document.documentElement.setAttribute("data-mood", nextMood);
      document.getElementById("mapContainer").setAttribute("data-mood", nextMood);
      shiftData = moodToShift[currentMood] || moodToShift.day;
      algoRun = runAlgorithm(CITY, shiftData);
      currentFrameIdx = Math.min(12, algoRun.frames.length - 1);
      progress = 0;
      lastRenderedClosed = null;
      if (currentMood === "rain") {
        rain.start();
      } else {
        rain.stop();
      }
      updateActors();
    }

    moodSelect.addEventListener("change", (e) => updateMood(e.target.value));
    themeSelect.addEventListener("change", (e) => {
      document.documentElement.setAttribute("data-theme", e.target.value);
    });

    playBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? "Pause" : "Play";
    });

    stepBtn.addEventListener("click", () => {
      isPlaying = false;
      playBtn.textContent = "Play";
      progress = 0;
      currentFrameIdx = (currentFrameIdx + 1) % algoRun.frames.length;
      updateActors();
    });

    updateActors();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
